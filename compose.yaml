# web + worker: same image, different command.
x-hardening: &hardening
  build: .
  image: localfiletools:latest
  env_file: .env
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true  # reaps killed job children
  tmpfs: ["/tmp:size=64m"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  web:
    <<: *hardening
    # the access log must show the proxy's address, never a visitor's
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8080", "--no-proxy-headers"]
    ports: ["127.0.0.1:8080:8080"]  # cloudflared on the host is the only client
    volumes:
      - state:/data/state
      - jobs:/data/jobs
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/session')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *hardening
    command: ["python", "-m", "app.worker"]
    network_mode: none
    volumes:
      - jobs:/data/jobs  # the worker does not need the state volume
    mem_limit: 2g
    cpus: 2

volumes:
  state:
  jobs:
