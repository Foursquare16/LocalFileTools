[project]
name = "localfiletools"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.6",
    "img2pdf>=0.6.3",
    "pikepdf>=10",
    "pillow>=11.3",
    "pillow-heif>=1.8.1",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]
